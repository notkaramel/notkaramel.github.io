<!DOCTYPE html>
<html
  lang="{{ site.Language.LanguageCode }}"
  dir="{{ or site.Language.LanguageDirection `ltr` }}"
>
  <head>
    {{ partial "head.html" . }}
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap");
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="w-full mx-auto px-4 font-[Lato] m-1 text-base">
    <header class="border-b-2 border-indigo-700 mb-4 py-2">
      {{ partial "header.html" . }}
    </header>
    <div class="flex flex-wrap items-center justify-left">
      <main>{{ block "main" . }}{{ end }}</main>
    </div>
    <footer class="border-t-2 border-indigo-700 mt-4 py-2">
      {{ partial "footer.html" . }}
    </footer>
  </body>
</html>
